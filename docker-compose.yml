services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-counselling-backend
    env_file:
      - .env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    # Mount Google service-account JSON read-only if you reference it via
    # GOOGLE_APPLICATION_CREDENTIALS or TTS_CREDENTIALS in .env.
    # volumes:
    #   - ./gen-lang-client-XXXX.json:/secrets/gcp-sa.json:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Browser hits this URL directly — must be reachable from the user's machine,
        # not from inside the container network. For local dev, localhost works.
        NEXT_PUBLIC_FASTAPI_BASE_URL: ${NEXT_PUBLIC_FASTAPI_BASE_URL:-http://localhost:8000}
    container_name: ai-counselling-frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
